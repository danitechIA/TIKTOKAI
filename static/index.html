<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#08080c">
  <title>TikTokAI · Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css?v=24">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js" defer></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
</head>
<body>

  <!-- ===================== LOGIN ===================== -->
  <div id="login" class="login-wrap hidden">
    <div class="panel login-card">
      <div class="logo-big">🎬</div>
      <h1 style="font-family:'Space Grotesk';font-size:24px;margin-bottom:6px;">TikTok<span class="grad-text">AI</span></h1>
      <p class="hint-text" style="margin-bottom:22px;">Studio de edición y subtítulos</p>
      <div class="field"><input type="password" id="login-pass" placeholder="Contraseña de acceso" onkeydown="if(event.key==='Enter')doLogin()"></div>
      <button class="btn btn-primary btn-block" onclick="doLogin()">Entrar</button>
      <p id="login-err" class="hint-text" style="color:var(--err);margin-top:12px;"></p>
    </div>
  </div>

  <div id="app" class="hidden">

    <!-- ===================== HOME: proyectos ===================== -->
    <div id="home">
      <div class="home-top">
        <div class="brand">
          <div class="logo">🎬</div>
          <div class="title">TikTok<span class="grad-text">AI</span></div>
        </div>
        <div class="topbar-actions">
          <button class="btn btn-ghost btn-sm" id="theme-btn" onclick="toggleTheme()" title="Tema"><i data-lucide="moon" class="ic"></i></button>
          <button class="btn btn-ghost btn-sm" onclick="logout()">Salir</button>
        </div>
      </div>

      <div class="home-body">
        <div class="dropzone" id="dropzone" onclick="document.getElementById('file-input').click()">
          <div class="dz-icon">📲</div>
          <div class="dz-main">Sube tu vídeo vertical</div>
          <div class="dz-sub">Toca aquí · MP4, MOV…</div>
          <div class="progress-bar hidden" id="upload-progress"><div class="fill"></div></div>
        </div>
        <input type="file" id="file-input" accept="video/*" class="hidden" onchange="handleUpload(this.files[0])">

        <div class="home-sect">Mis vídeos</div>
        <div class="proj-list" id="proj-list"></div>
      </div>
    </div>

    <!-- ===================== EDITOR a pantalla completa ===================== -->
    <div id="editor" class="hidden">

      <!-- Barra superior: cerrar · estado · exportar -->
      <header class="ed-top">
        <button class="ed-icon" onclick="closeEditor()" title="Volver"><i data-lucide="x" class="ic"></i></button>
        <div class="ed-top-mid">
          <span class="ed-name" id="ed-name">Proyecto</span>
          <span class="ed-badge" id="ed-badge">1080P</span>
        </div>
        <button class="ed-export" id="btn-render" onclick="doRender()"><i data-lucide="upload" class="ic"></i> <span>Exportar</span></button>
      </header>

      <!-- Escenario: el vídeo -->
      <div class="ed-stage">
        <div class="phone" id="phone">
          <video id="preview-video" playsinline onclick="togglePlay()"></video>
          <div class="sub-overlay" id="sub-overlay"></div>
          <div class="hook-overlay" id="title-overlay"></div>
        </div>
        <div id="job-status" class="job-status hidden"></div>
      </div>

      <!-- Transporte: tiempo · play · deshacer -->
      <div class="ed-transport">
        <span class="ed-time" id="tle-time">00:00 / 00:00</span>
        <div class="ed-transport-mid">
          <button class="ed-icon" onclick="seekTo(0)" title="Al inicio"><i data-lucide="skip-back" class="ic"></i></button>
          <button class="ed-play" id="btn-play" onclick="togglePlay()"><i data-lucide="play" class="ic"></i></button>
          <button class="ed-icon" onclick="doUndo()" title="Deshacer"><i data-lucide="undo-2" class="ic"></i></button>
        </div>
        <div class="ed-transport-right">
          <button class="ed-icon" id="btn-source" onclick="toggleSource()" title="Ver render"><i data-lucide="eye" class="ic"></i></button>
          <button class="ed-icon" onclick="tlZoom(0.7)" title="Alejar"><i data-lucide="zoom-out" class="ic"></i></button>
          <button class="ed-icon" onclick="tlZoom(1.45)" title="Acercar"><i data-lucide="zoom-in" class="ic"></i></button>
        </div>
      </div>

      <!-- LÍNEA DE TIEMPO: el cursor está fijo en el centro y la cinta se mueve -->
      <div class="ed-timeline" id="timeline-section">
        <div class="tl-playhead"></div>
        <div class="tl-scroll" id="tle-scroll">
          <div class="tl-inner" id="tle-inner"></div>
        </div>
        <div class="tle-tip hidden" id="tle-tip"></div>
        <div class="tl-empty hidden" id="tl-empty">
          <i data-lucide="wand-2" class="ic"></i> Transcribe el vídeo para ver aquí los subtítulos
        </div>
      </div>

      <!-- Barra de herramientas -->
      <nav class="ed-tools" id="ed-tools"></nav>
    </div>
  </div>

  <!-- ===================== HOJA INFERIOR (ajustes) ===================== -->
  <div class="sheet-bd hidden" id="sheet-bd" onclick="closeSheet()"></div>
  <section class="sheet hidden" id="sheet" aria-modal="true">
    <div class="sheet-grab" id="sheet-grab"></div>
    <div class="sheet-head">
      <span class="sheet-title" id="sheet-title">Ajustes</span>
      <button class="ed-icon" onclick="closeSheet()"><i data-lucide="check" class="ic"></i></button>
    </div>
    <div class="sheet-body" id="inspector"></div>
  </section>

  <div class="toast" id="toast"></div>
  <script src="/static/app.js?v=24" defer></script>
</body>
</html>
